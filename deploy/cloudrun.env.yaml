# Non-secret Cloud Run env for `gcloud run deploy --env-vars-file`.
# Replace relief-desk before you deploy. Do not put keys in this file.
# GEMINI_API_KEY, JWT_SECRET, GOOGLE_MAPS_API_KEY and SALT_PHONE_HASH come from Secret Manager.
DEMO_MODE: "true"
# production: the fixed demo token is refused.
# Judges sign in through /api/auth/demo-login, which signs a real JWT with JWT_SECRET.
# The password form needs COORDINATOR_PASSWORD. The one-click button does not.
ENV: "production"
DEMO_SEED: "small"
GEMINI_ENABLED: "true"
AI_MODE: "auto"
GEMINI_BACKEND: "auto"
VERTEX_PROJECT: "relief-desk"
VERTEX_LOCATION: "global"
VERTEX_MODEL: "gemini-2.5-flash"
GEMINI_MODEL: "gemini-3.5-flash-lite"
GEMINI_EMBED_MODEL: "gemini-embedding-001"
GEMINI_EMBED_DIM: "768"
GEMINI_EMBED_TASK: "SEMANTIC_SIMILARITY"
GEMINI_DAILY_CALL_CAP: "2000"
GEMINI_TIMEOUT_S: "20"
AI_CONCURRENCY: "2"
LOG_LEVEL: "INFO"
GCP_PROJECT_ID: "relief-desk"
GCP_REGION: "asia-south1"
# Empty overrides the code default (127.0.0.1:8080) so Cloud Run does not
# probe a Firestore emulator. Case rows stay in process memory.
FIRESTORE_EMULATOR_HOST: ""
FIREBASE_AUTH_EMULATOR_HOST: ""
API_CORS_ORIGINS: '["https://relief-desk.web.app","https://relief-desk.firebaseapp.com","http://localhost:4200"]'
SUPPORTED_LANGS: '["en","hi","hinglish","ml"]'
DEFAULT_LANG: "en"
RATE_LIMIT_REPORTS_PER_HOUR: "10"
PUBSUB_TOPIC_ALERTS: "alerts"
GCS_BUCKET_MEDIA: "relief-desk-media"
