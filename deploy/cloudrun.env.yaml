# Non-secret Cloud Run env for `gcloud run deploy --env-vars-file`.
# Replace your-project-id before you deploy. Do not put keys in this file.
# GEMINI_API_KEY, JWT_SECRET, and GOOGLE_MAPS_API_KEY come from Secret Manager.
DEMO_MODE: "true"
DEMO_SEED: "small"
GEMINI_ENABLED: "true"
AI_MODE: "auto"
GEMINI_MODEL: "gemini-3.8-flash"
GEMINI_EMBED_MODEL: "gemini-embedding-001"
GEMINI_EMBED_DIM: "768"
GEMINI_EMBED_TASK: "SEMANTIC_SIMILARITY"
GEMINI_DAILY_CALL_CAP: "2000"
GEMINI_TIMEOUT_S: "12"
AI_CONCURRENCY: "2"
LOG_LEVEL: "INFO"
GCP_PROJECT_ID: "your-project-id"
GCP_REGION: "asia-south1"
# Empty overrides the code default (127.0.0.1:8080) so Cloud Run does not
# probe a Firestore emulator. Case rows stay in process memory.
FIRESTORE_EMULATOR_HOST: ""
FIREBASE_AUTH_EMULATOR_HOST: ""
API_CORS_ORIGINS: '["https://your-project-id.web.app","https://your-project-id.firebaseapp.com","http://localhost:4200"]'
SUPPORTED_LANGS: '["en","hi","hinglish","ml"]'
DEFAULT_LANG: "en"
RATE_LIMIT_REPORTS_PER_HOUR: "10"
SALT_PHONE_HASH: "replace-me"
PUBSUB_TOPIC_ALERTS: "alerts"
GCS_BUCKET_MEDIA: "your-project-relief-desk-media"
