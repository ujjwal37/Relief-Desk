incidents:
- id: INC-001
  type: rescue
  ward_id: ward_3
  landmark_id: LM-11
  lat: 9.436
  lng: 76.398
  people: 8
  vulnerable:
    child: true
    elderly: true
    disabled: false
    pregnant: false
    medical_need: false
  hazard: water_rising
  urgency_band: critical
  reported_at: '2026-10-12T07:15:00Z'
  description: Rising water reaching second floor of residential house near Nedumudi Boat Jetty. 3 children
    and 2 elderly family members trapped on terrace.
  sample_reports:
  - lang: hi
    text: नेदुमुडी Boat Jetty के पास पानी पहली मंजिल तक आ गया है, छत पर 8 लोग फंसे हैं जिनमें 3 बच्चे
      और 2 बुजुर्ग हैं। तुरंत नाव भेजो!
  - lang: hinglish
    text: Nedumudi Boat Jetty ke pass paani 1st floor tak chad gaya hai, chhat par 8 log fase hain, bachhe
      aur bujurg sath hain please rescue boat bhejo.
  - lang: en
    text: Flood water entering 1st floor near Nedumudi Boat Jetty. 8 people including 3 children and 2
      elderly stranded on rooftop, urgent boat needed.
  - lang: ta
    text: "நெடுமுடி படகுத்துறை அருகே வெள்ளம் முதல் தளத்தில் நுழைந்தது. 8 பேர், அதில் 3 குழந்தைகள் மற்றும் 2 முதியவர்கள், மாடியில் சிக்கியுள்ளனர். உடனே படகு அனுப்பவும்."
- id: INC-002
  type: medical
  ward_id: ward_1
  landmark_id: LM-01
  lat: 9.476
  lng: 76.39
  people: 3
  vulnerable:
    child: false
    elderly: true
    disabled: false
    pregnant: false
    medical_need: true
  hazard: stranded
  urgency_band: critical
  reported_at: '2026-10-12T07:25:00Z'
  description: Diabetic elderly patient suffering acute insulin shock, house marooned with chest-deep
    water outside Kainakary LP School.
  sample_reports:
  - lang: hi
    text: काइनकरी LP School के पास बुजुर्ग पिता को इंसुलिन का दौरा पड़ रहा है। बाहर सीने तक पानी है, एम्बुलेंस
      नहीं आ सकती।
  - lang: hinglish
    text: Kainakary LP School ke paas father diabetic hain aur behosh ho rahe hain, bahar chest deep pani
      hai rescue chahiye.
  - lang: en
    text: Elderly father having severe diabetic emergency near Kainakary LP School, house surrounded by
