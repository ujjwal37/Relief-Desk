id: flood
title: Urban Flood Relief
description: Synthetic scenario inspired by Kerala floods. Water rising, people stranded, food and medical assistance. People in the reports are fictional.
incident_types:
  - rescue
  - food
  - medical
  - shelter
  - info
tiles:
  - id: trapped_water
    label_en: Trapped in Water
    label_hi: पानी में फंसे हैं
    incident_type: rescue
    icon: water
  - id: medical_urgent
    label_en: Medical Assistance
    label_hi: चिकित्सा सहायता
    incident_type: medical
    icon: medkit
  - id: food_water_needed
    label_en: Food & Drinking Water
    label_hi: भोजन और पेयजल
