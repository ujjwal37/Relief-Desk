[project]
name = "relief-desk-api"
version = "0.1.0"
description = "Relief Desk FastAPI backend for crisis coordination"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.0",
    "Pillow>=11.3,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
