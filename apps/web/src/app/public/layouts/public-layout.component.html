<div class="public-shell" [class.chat]="chat()">
  @if (!chat()) {
    <header class="app-nav">
      <a routerLink="/" class="brand" aria-label="Relief Desk">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="var(--brand)"/><path d="M12 7v8M8 11h8" stroke="var(--on-brand)" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>{{ 'landing.title' | rdTranslate }}</span>
      </a>
      <div class="actions"><rd-call-pill /><rd-settings-button /></div>
    </header>
  }

  @if (demo() && !chat()) {
    <div class="demo-bar"><app-scenario-switcher></app-scenario-switcher></div>
  }

  <main class="content-container">
    <router-outlet></router-outlet>
    @if (!chat()) { <rd-quiet-footer /> }
  </main>

  @if (!chat()) {
    <nav class="tabs" aria-label="Main">
      <a routerLink="/" class="tab" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="on">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
        <span>{{ 'nav.home2' | rdTranslate }}</span>
      </a>
      <a routerLink="/nearby" class="tab" routerLinkActive="on">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span>{{ 'nav.nearby2' | rdTranslate }}</span>
      </a>
      <a routerLink="/report" class="tab fab-tab" [attr.aria-label]="'nav.reportFab' | rdTranslate">
        <span class="fab"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <span>{{ 'nav.reportFab' | rdTranslate }}</span>
      </a>
      <a routerLink="/status" class="tab" routerLinkActive="on">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="16" r="3"/></svg>
        <span>{{ 'nav.status2' | rdTranslate }}</span>
      </a>
      <button type="button" class="tab" (click)="openHelp()">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>
        <span>{{ 'nav.help' | rdTranslate }}</span>
      </button>
    </nav>
  }
</div>
