<div class="public-shell">
  <div class="emergency-header">
    <div class="emergency-bar">
      <span>🚨 {{ 'safety.banner' | rdTranslate }}</span>
      <a href="tel:112" class="call-pill">{{ 'safety.call112' | rdTranslate }}</a>
    </div>
    <header class="app-nav">
      <a routerLink="/" class="nav-brand">
        <span class="icon">🛡️</span>
        <span class="name">{{ 'landing.title' | rdTranslate }}</span>
      </a>
      <nav class="nav-links">
        <a routerLink="/report" class="nav-link">{{ 'nav.report' | rdTranslate }}</a>
        <a routerLink="/status" class="nav-link">{{ 'nav.status' | rdTranslate }}</a>
        <a routerLink="/nearby" class="nav-link">{{ 'nav.nearby' | rdTranslate }}</a>
      </nav>
      <app-scenario-switcher></app-scenario-switcher>
      <div class="nav-actions">
        <rd-language-switcher></rd-language-switcher>
      </div>
    </header>
  </div>

  <main class="content-container">
    <router-outlet></router-outlet>
  </main>
</div>
