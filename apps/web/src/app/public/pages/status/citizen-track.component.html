<section class="track" data-testid="citizen-track" aria-live="polite">
  <h2>{{ 'track.yourTeam' | rdTranslate }}</h2>
  <p class="line">{{ line() }}</p>
  @if (data()?.simulated) { <p class="sim">{{ 'track.simulated' | rdTranslate }}</p> }
  @if (data()?.stale) { <p class="stale">{{ 'track.stale' | rdTranslate }}</p> }
  @if (updatedLabel()) { <p class="when">{{ updatedLabel() }}</p> }
  @if (svg(); as map) {
    <rd-map-provider [pins]="pins()" [center]="center()">
      <svg viewBox="0 0 280 160" class="mini" role="img" [attr.aria-label]="'track.yourTeam' | rdTranslate">
        <rect width="280" height="160" rx="12" fill="var(--map-bg)"/>
        @if (map.trail) {
          <polyline [attr.points]="map.trail" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linecap="round"/>
        }
        @if (map.place) {
          <line [attr.x1]="map.team.x" [attr.y1]="map.team.y" [attr.x2]="map.place.x" [attr.y2]="map.place.y" stroke="var(--brand)" stroke-width="2.5" stroke-dasharray="6 4"/>
          <g [rdPin]="map.caseSpec" [attr.transform]="'translate(' + map.place.x + ' ' + map.place.y + ')'" role="img" [attr.aria-label]="map.caseTitle"></g>
        }
        <g [rdPin]="map.teamSpec" [attr.transform]="'translate(' + map.team.x + ' ' + map.team.y + ')'" role="img" [attr.aria-label]="map.teamTitle"></g>
      </svg>
    </rd-map-provider>
  }
</section>
