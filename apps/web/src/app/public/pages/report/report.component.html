<div class="report-view">
  <div class="offline-banner" *ngIf="!offlineSync.isOnline()">
    <span>{{ 'safety.offlineNotice' | rdTranslate }}</span>
    <span class="badge" *ngIf="offlineSync.pendingCount() > 0">Queued: {{ offlineSync.pendingCount() }}</span>
  </div>

  <div class="report-topbar">
    <div class="location-badge">
      <span class="pin-icon" aria-hidden="true">📍</span>
      <span class="location-text">{{ locationText() }}</span>
    </div>
    <div class="mode-switch" role="tablist" aria-label="Report input mode">
      <button type="button" role="tab" [attr.aria-selected]="mode() === 'chat'" [class.on]="mode() === 'chat'" (click)="mode.set('chat')">
        {{ 'report.chatTab' | rdTranslate }}
      </button>
      <button type="button" role="tab" [attr.aria-selected]="mode() === 'form'" [class.on]="mode() === 'form'" (click)="openForm()">
        {{ 'report.formTab' | rdTranslate }}
      </button>
    </div>
  </div>

  <div class="form-container" *ngIf="mode() === 'form'">
    <div class="form-header">
      <h3>{{ 'report.formTab' | rdTranslate }}</h3>
      <p class="form-sub">{{ 'confirm.nothingSent' | rdTranslate }}</p>
    </div>
    <div class="quick-tiles">
      <button
        type="button"
        class="tile"
        *ngFor="let tile of tiles()"
        [class.active]="pendingCard()?.incident_type === tile.incident_type"
        (click)="selectFormType(tile.incident_type)"
      >
        <span aria-hidden="true">{{ tileIcon(tile.icon) }}</span>
        {{ tileLabel(tile) }}
      </button>
    </div>

    <label class="field">
      <span>{{ 'confirm.location' | rdTranslate }}</span>
      <input type="text" [ngModel]="locationText()" (ngModelChange)="updatePlace($event)" />
    </label>
    <label class="field">
      <span>{{ 'confirm.people' | rdTranslate }}</span>
      <input type="number" min="0" max="99" [ngModel]="pendingCard()?.people_count" (ngModelChange)="updatePeople($event)" />
    </label>
    <div class="vuln-row">
      <button type="button" class="tile" [class.active]="isVulnerableChecked('child')" (click)="toggleFormVulnerable('child')">{{ 'confirm.child' | rdTranslate }}</button>
      <button type="button" class="tile" [class.active]="isVulnerableChecked('elderly')" (click)="toggleFormVulnerable('elderly')">{{ 'confirm.elderly' | rdTranslate }}</button>
      <button type="button" class="tile" [class.active]="isVulnerableChecked('pregnant')" (click)="toggleFormVulnerable('pregnant')">{{ 'confirm.pregnant' | rdTranslate }}</button>
      <button type="button" class="tile" [class.active]="isVulnerableChecked('medical_need')" (click)="toggleFormVulnerable('medical_need')">{{ 'confirm.medical' | rdTranslate }}</button>
    </div>

    <rd-confirmation-card
      *ngIf="pendingCard() as card"
      [card]="card"
      [busy]="isLoading()"
      (cardChange)="onCardEdited($event)"
      (send)="confirmAndSubmit($event)"
    ></rd-confirmation-card>
  </div>

  <div class="chat-thread" *ngIf="mode() === 'chat'">
    <div
      *ngFor="let msg of chatMessages()"
      class="chat-bubble-row"
      [class.user-row]="msg.role === 'user'"
      [class.assistant-row]="msg.role === 'assistant'"
    >
      <div class="avatar" *ngIf="msg.role === 'assistant'" aria-hidden="true">RD</div>
      <div class="bubble" [class.user-bubble]="msg.role === 'user'" [class.assistant-bubble]="msg.role === 'assistant'">
        <p class="msg-text">{{ msg.text }}</p>
      </div>
    </div>

    <div class="typing-indicator" *ngIf="isLoading()">Relief Desk is reading the message...</div>

    <div class="quick-chips-row" *ngIf="chatMessages().length <= 2">
      <button type="button" class="chip" (click)="setQuickChip('Gandhi school ke paas 5 log chat par hain, paani badh raha hai, 2 bache hain')">
        Flood rescue (Hinglish)
      </button>
      <button type="button" class="chip" (click)="setQuickChip('गांधी स्कूल के पास 5 लोग छत पर फंसे हैं, 2 बच्चे हैं')">
        बाढ़ बचाव (Hindi)
      </button>
      <button type="button" class="chip" (click)="setQuickChip('3 people stranded on rooftop, water level rising rapidly')">
        3 people stranded (English)
      </button>
    </div>

    <rd-confirmation-card
      *ngIf="pendingCard() as card"
      [card]="card"
      [busy]="isLoading()"
      (cardChange)="onCardEdited($event)"
      (send)="confirmAndSubmit($event)"
    ></rd-confirmation-card>
  </div>

  <div class="action-footer" *ngIf="mode() === 'chat'">
    <div class="input-row">
      <button
        type="button"
        class="voice-btn"
        [class.recording]="isRecording()"
        (click)="toggleVoice()"
        aria-label="Toggle voice input"
      >
        {{ isRecording() ? ('report.listening' | rdTranslate) : 'Mic' }}
      </button>
      <input
        type="text"
        [placeholder]="'report.placeholder' | rdTranslate"
        [ngModel]="userInput()"
        (ngModelChange)="userInput.set($event)"
        (keyup.enter)="sendUserMessage()"
      />
      <button
        type="button"
        class="send-btn"
        [disabled]="!userInput().trim() || isLoading()"
        (click)="sendUserMessage()"
      >
        {{ 'report.send' | rdTranslate }}
      </button>
    </div>

    <div class="fast-links">
      <a [href]="offlineSync.getPrefilledSmsLink(userInput() || pendingCard()?.summary || '')" class="sms-btn">Send by SMS</a>
      <a href="tel:112" class="call112-link">{{ 'safety.call112' | rdTranslate }}</a>
    </div>
  </div>
</div>
