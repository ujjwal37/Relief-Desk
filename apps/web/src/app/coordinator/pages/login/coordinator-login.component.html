<div class="login-wrapper">
  <div class="login-card">
    <div class="header">
      <span class="icon">🛡️</span>
      <h2>Coordinator Portal</h2>
      <p class="sub">Authorized Responders and Triage Leads</p>
    </div>

    <form class="login-form" (submit)="$event.preventDefault(); loginDemo()">
      <div class="field">
        <label>Email Address</label>
        <input type="email" value="demo-coordinator@reliefdesk.internal" readonly />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" value="••••••••••••" readonly />
      </div>

      <div class="demo-notice">
        <span>🔑 Demo Account: Pre-seeded synthetic coordinator credentials</span>
      </div>

      <button type="submit" class="submit-btn">Enter Command View</button>
    </form>

    <div class="footer">
      <a routerLink="/" class="back-link">← Return to Public Home</a>
    </div>
  </div>
</div>
