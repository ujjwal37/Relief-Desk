<div class="coordinator-shell">
  <header class="top-nav">
    <div class="left-cluster">
      <a routerLink="/" class="brand-badge">
        <span class="shield">🛡️</span>
        <span class="title">{{ 'landing.title' | rdTranslate }} - {{ 'nav.coordinator' | rdTranslate }}</span>
      </a>
      <span class="scenario-pill">🌊 Flood Scenario (Main Demo)</span>
    </div>

    <div class="right-cluster">
      <rd-language-switcher></rd-language-switcher>
      <span class="live-pill">● LIVE MONITOR</span>
      <span class="demo-user">{{ authService.currentUser()?.email || 'demo-coordinator@reliefdesk.internal' }}</span>
      <button type="button" class="nav-btn" (click)="logout()">{{ 'nav.logout' | rdTranslate }}</button>
    </div>
  </header>

  <main class="dashboard-body">
    <router-outlet></router-outlet>
  </main>
</div>
